[package]
name = "arf_line"
version = "0.1.0"
description = "Arf liquidity line: a lender's USDC in a program vault, drawn by a licensed rail operator within limit, term and fee, repaid first in, first out"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "arf_line"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", default-features = false, features = ["solana-v4", "event-cpi"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["solana-v4", "token", "token_2022", "token_2022_extensions"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-account = "4.3.0"
solana-clock = "3.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
